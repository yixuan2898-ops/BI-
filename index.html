<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>🐾 英文生字消消乐 | 儿童英语配对游戏 | 单词小英雄</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 防止拖动/选中，适合儿童点击 */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #b5e3ff 0%, #9fd3f5 100%);
            font-family: 'Comic Neue', 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Poppins', 'Segoe UI Emoji', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        /* 主游戏面板 */
        .game-container {
            max-width: 1400px;
            width: 100%;
            background: #fffef7;
            border-radius: 72px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 24px 28px 36px;
            transition: all 0.2s;
        }

        /* 头部区 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            background: #ffefc0;
            padding: 12px 28px;
            border-radius: 80px;
            box-shadow: 0 6px 0 #f3d59b;
        }
        .title-area {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .title-area h1 {
            font-size: 2.3rem;
            background: linear-gradient(135deg, #ff784b, #ff3b6f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 0 #fff0cf;
            letter-spacing: 1px;
        }
        .mascot {
            background: #ffe1a0;
            border-radius: 100px;
            padding: 6px 20px;
            font-size: 1.9rem;
            box-shadow: 0 4px 0 #dcb572;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .music-btn {
            background: white;
            border: none;
            font-size: 1.7rem;
            padding: 10px 22px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .music-btn:active { transform: scale(0.96); }

        /* 统计信息栏 */
        .game-stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            background: #fdf0da;
            border-radius: 56px;
            padding: 14px 22px;
            margin: 20px 0 25px;
            gap: 15px;
            align-items: center;
        }
        .stat {
            background: #fff6e6;
            padding: 6px 20px;
            border-radius: 48px;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: inset 0 -1px 0 #ffdfb0, 0 6px 12px rgba(0,0,0,0.03);
        }
        .progress-area {
            flex: 2;
            min-width: 160px;
        }
        .progress-bar-bg {
            background: #e2cfb3;
            border-radius: 30px;
            height: 18px;
            overflow: hidden;
            width: 100%;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6fcf97, #2ecc71);
            border-radius: 30px;
            transition: width 0.3s ease;
        }
        .stars-area span {
            font-size: 1.9rem;
            letter-spacing: 5px;
        }
        .level-area select {
            background: #ffda7c;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            padding: 7px 18px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
        }

        /* 卡片网格 电脑手机自适应 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 155px));
            justify-content: center;
            gap: 20px;
            margin: 30px 0 25px;
        }
        .card {
            aspect-ratio: 3 / 4;
            background-color: #ffe8c7;
            border-radius: 32px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            box-shadow: 0 12px 18px rgba(0, 0, 0, 0.15);
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card.matched {
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.75);
            transition: visibility 0.2s, opacity 0.3s, transform 0.3s;
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px 8px;
            box-sizing: border-box;
        }
        .card-front {
            background: linear-gradient(145deg, #fff9ed, #fff2e2);
            transform: rotateY(180deg);
            border: 3px solid #ffbc7a;
        }
        .card-back {
            background: #ffbc7a;
            background-image: radial-gradient(circle at 25% 35%, rgba(255,245,200,0.7) 3%, transparent 3.5%);
            background-size: 22px 22px;
            transform: rotateY(0deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .card-back span:first-child {
            font-size: 3.5rem;
        }
        .word-emoji {
            font-size: 2.8rem;
            margin-bottom: 8px;
        }
        .word-text {
            font-size: 1.2rem;
            font-weight: bold;
            background: #ffe2b5;
            padding: 5px 12px;
            border-radius: 40px;
            margin-top: 8px;
        }
        .sound-icon {
            background: #ffbc6e;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.1s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .sound-icon:active { transform: scale(0.9);}
        .chinese-text {
            font-size: 0.85rem;
            background: #ffebc2;
            padding: 3px 10px;
            border-radius: 30px;
            margin-top: 6px;
        }

        /* 反馈消息 */
        .feedback-area {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 8px 0;
            min-height: 80px;
            background: #fff3df;
            border-radius: 60px;
            padding: 12px;
            letter-spacing: 1px;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 12px;
        }
        .btn {
            background: #ffa54d;
            border: none;
            font-size: 1.3rem;
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: bold;
            color: #3b2a1a;
            box-shadow: 0 6px 0 #b85e0e;
            cursor: pointer;
            transition: 0.05s linear;
            font-family: inherit;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b85e0e;}

        /* 模态窗 */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.2s;
        }
        .modal.show {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: #fffef0;
            max-width: 480px;
            width: 85%;
            border-radius: 68px;
            padding: 38px 28px;
            text-align: center;
            box-shadow: 0 30px 35px rgba(0,0,0,0.3);
        }
        .modal-content h2 { font-size: 2.2rem; margin-bottom: 20px; }
        .modal-content p { font-size: 1.3rem; margin: 12px 0; }

        /* 动效区 */
        @keyframes bounceSoft {
            0% { transform: scale(1); }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .bounce-animation {
            animation: bounceSoft 0.3s ease;
        }
        @keyframes starRain {
            0% { transform: translateY(-40px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(90px) rotate(360deg); opacity: 0; }
        }
        .star-fall {
            position: fixed;
            pointer-events: none;
            font-size: 2.3rem;
            animation: starRain 0.9s forwards;
            z-index: 200;
        }
        @keyframes shakeCard {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
        .shake-card {
            animation: shakeCard 0.2s ease-in-out 2;
        }
        .card:hover:not(.matched):not(.flipped) {
            transform: scale(1.02);
            transition: transform 0.15s;
        }
        @media (max-width: 750px) {
            .game-container { padding: 16px; }
            .cards-grid { gap: 14px; grid-template-columns: repeat(auto-fill, minmax(110px, 120px)); }
            .word-text { font-size: 0.9rem; }
            .stat { font-size: 0.9rem; padding: 4px 12px; }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameApp">
    <div class="header">
        <div class="title-area">
            <h1>📖 单词消消乐 🧸</h1>
            <div class="mascot">
                <span>🦄</span><span>拼字小英雄</span>
            </div>
        </div>
        <button class="music-btn" id="bgMusicBtn">🔊 音乐开</button>
    </div>

    <div class="game-stats">
        <div class="stat">⭐ 分数: <span id="scoreValue">0</span></div>
        <div class="stat">🔥 COMBO: <span id="comboValue">0</span>x</div>
        <div class="stat">⏱️ 剩余: <span id="timerValue">00:00</span></div>
        <div class="stat progress-area">
            <div>📈 关卡进度</div>
            <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="stat stars-area">🌟 <span id="starsDisplay">☆☆☆</span></div>
        <div class="stat level-area">
            <label>🎮 难度</label>
            <select id="levelSelect">
                <option value="1">🐣 Level 1 (6对)</option>
                <option value="2" selected>🐰 Level 2 (8对)</option>
                <option value="3">🦊 Level 3 (10对)</option>
            </select>
        </div>
    </div>

    <div class="feedback-area" id="feedbackMsg">🐣 点击卡片，配对单词 + 图片！✨</div>
    <div class="cards-grid" id="cardsGrid"></div>
    <div class="action-buttons">
        <button class="btn" id="startGameBtn">🎮 Start Game</button>
        <button class="btn" id="resetGameBtn">🔄 重新开始</button>
    </div>
</div>

<div class="modal" id="gameOverModal">
    <div class="modal-content">
        <h2>🏆 游戏结束 🏆</h2>
        <p>✨ 最终得分: <strong id="finalScoreSpan">0</strong></p>
        <p>⭐ 获得星星: <span id="finalStarsSpan">☆☆☆</span></p>
        <p>📚 新学单词: <span id="newWordsCount">0</span></p>
        <button class="btn" id="playAgainBtn">🎈 Play Again 🎈</button>
    </div>
</div>

<script>
    // ----------------------------- 单词库（包含六大主题）
    const VOCABULARY = [
        { eng: "Cat", chn: "猫", emoji: "🐱", example: "The cat is sleeping on the sofa.", theme: "Animals" },
        { eng: "Dog", chn: "狗", emoji: "🐶", example: "My dog loves to play fetch.", theme: "Animals" },
        { eng: "Bird", chn: "鸟", emoji: "🐦", example: "The bird can fly high.", theme: "Animals" },
        { eng: "Pizza", chn: "披萨", emoji: "🍕", example: "I love eating pizza!", theme: "Food" },
        { eng: "Apple", chn: "苹果", emoji: "🍎", example: "An apple a day keeps the doctor away.", theme: "Food" },
        { eng: "Burger", chn: "汉堡", emoji: "🍔", example: "Cheeseburger is yummy.", theme: "Food" },
        { eng: "Book", chn: "书本", emoji: "📚", example: "I read a book at school.", theme: "School" },
        { eng: "Pen", chn: "钢笔", emoji: "✒️", example: "Write with a pen.", theme: "School" },
        { eng: "Ruler", chn: "尺子", emoji: "📏", example: "Measure the desk.", theme: "School" },
        { eng: "Eye", chn: "眼睛", emoji: "👁️", example: "Close your eyes.", theme: "Body Parts" },
        { eng: "Hand", chn: "手", emoji: "✋", example: "Wash your hands before eating.", theme: "Body Parts" },
        { eng: "Foot", chn: "脚", emoji: "🦶", example: "My foot is big.", theme: "Body Parts" },
        { eng: "Car", chn: "汽车", emoji: "🚗", example: "The red car is fast.", theme: "Transportation" },
        { eng: "Bus", chn: "公交车", emoji: "🚌", example: "School bus is yellow.", theme: "Transportation" },
        { eng: "Train", chn: "火车", emoji: "🚆", example: "The train goes choo-choo.", theme: "Transportation" },
        { eng: "Sun", chn: "太阳", emoji: "☀️", example: "The sun is bright today.", theme: "Weather" },
        { eng: "Rain", chn: "雨", emoji: "🌧️", example: "Rain makes the grass grow.", theme: "Weather" },
        { eng: "Cloud", chn: "云", emoji: "☁️", example: "Fluffy clouds in the sky.", theme: "Weather" }
    ];

    // 根据难度选取卡片对 (level: 1->6对, 2->8对, 3->10对)
    function getCardsByLevel(level) {
        let pairsNeeded = level === 1 ? 6 : (level === 2 ? 8 : 10);
        let shuffledAll = [...VOCABULARY];
        // 随机打乱保证主题多样
        for (let i = shuffledAll.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledAll[i], shuffledAll[j]] = [shuffledAll[j], shuffledAll[i]];
        }
        let selected = shuffledAll.slice(0, pairsNeeded);
        return selected; // 返回单词对象数组
    }

    // 全局游戏状态
    let gameCards = [];          // { id, wordObj, matched, flipped, pairId }
    let totalPairs = 0;
    let matchedCount = 0;
    let currentScore = 0;
    let currentCombo = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let gameActive = false;
    let lockBoard = false;
    let firstCard = null, secondCard = null;
    let currentLevel = 2;
    let bgmEnabled = true;

    // DOM 元素
    const cardsGrid = document.getElementById('cardsGrid');
    const scoreSpan = document.getElementById('scoreValue');
    const comboSpan = document.getElementById('comboValue');
    const timerSpan = document.getElementById('timerValue');
    const progressFill = document.getElementById('progressFill');
    const starsDisplaySpan = document.getElementById('starsDisplay');
    const feedbackDiv = document.getElementById('feedbackMsg');
    const levelSelect = document.getElementById('levelSelect');
    const startBtn = document.getElementById('startGameBtn');
    const resetBtn = document.getElementById('resetGameBtn');
    const playAgainModalBtn = document.getElementById('playAgainBtn');
    const gameOverModal = document.getElementById('gameOverModal');

    // ---------- 音效 (Web Audio 简易实现，兼容移动端与电脑)
    function playSound(type) {
        if (!window.AudioContext && !window.webkitAudioContext) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const context = new AudioCtx();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.connect(gain);
        gain.connect(context.destination);
        gain.gain.value = 0.25;
        if (type === 'correct') {
            oscillator.frequency.value = 880;
            oscillator.type = 'sine';
            gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.4);
            oscillator.start();
            oscillator.stop(context.currentTime + 0.3);
        } else if (type === 'wrong') {
            oscillator.frequency.value = 500;
            oscillator.type = 'triangle';
            gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.4);
            oscillator.start();
            oscillator.stop(context.currentTime + 0.4);
        } else if (type === 'win') {
            let freqs = [660, 880, 1100];
            freqs.forEach((f, idx) => {
                const osc = context.createOscillator();
                const g = context.createGain();
                osc.connect(g);
                g.connect(context.destination);
                g.gain.value = 0.2;
                osc.frequency.value = f;
                osc.type = 'sine';
                osc.start();
                osc.stop(context.currentTime + 0.2 + idx * 0.12);
            });
        }
        setTimeout(() => context.close(), 500);
    }

    // 语音发音 (英文 + 例句)
    function speakWord(word, example) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(`${word}. ${example}`);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        utterance.pitch = 1.2;
        window.speechSynthesis.speak(utterance);
    }

    // 显示鼓励 / 提示消息
    function showMessage(msg, isGood = true) {
        feedbackDiv.innerHTML = isGood ? `🎉 ${msg} 🎉` : `😢 ${msg} 😢`;
        feedbackDiv.classList.add('bounce-animation');
        setTimeout(() => feedbackDiv.classList.remove('bounce-animation'), 400);
    }

    // 星星掉落特效
    function dropStarEffect() {
        const starDiv = document.createElement('div');
        starDiv.innerText = '⭐';
        starDiv.classList.add('star-fall');
        starDiv.style.left = Math.random() * 80 + 10 + '%';
        starDiv.style.top = '15%';
        document.body.appendChild(starDiv);
        setTimeout(() => starDiv.remove(), 800);
    }

    // 更新星星显示 (根据分数)
    function updateStarsUI() {
        let starCount = 0;
        let maxPossibleScore = totalPairs * 12;
        if (currentScore >= maxPossibleScore * 0.7) starCount = 3;
        else if (currentScore >= maxPossibleScore * 0.4) starCount = 2;
        else if (currentScore >= maxPossibleScore * 0.2) starCount = 1;
        const starString = '★'.repeat(starCount) + '☆'.repeat(3 - starCount);
        starsDisplaySpan.innerText = starString;
    }

    // 整体UI刷新
    function refreshUI() {
        scoreSpan.innerText = currentScore;
        comboSpan.innerText = currentCombo;
        let mins = Math.floor(timeLeft / 60);
        let secs = timeLeft % 60;
        timerSpan.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        let progressPercent = (matchedCount / totalPairs) * 100;
        progressFill.style.width = `${progressPercent}%`;
        updateStarsUI();
        if (matchedCount === totalPairs && gameActive) {
            gameVictory();
        }
    }

    // 胜利处理
    function gameVictory() {
        if (!gameActive) return;
        gameActive = false;
        clearInterval(timerInterval);
        playSound('win');
        showMessage("🌟 完美通关！ Level Up！ 🌟", true);
        for (let i = 0; i < 6; i++) setTimeout(() => dropStarEffect(), i * 120);
        endGameFlow(true);
    }

    // 结束流程 (胜利或超时)
    function endGameFlow(isWin) {
        if (timerInterval) clearInterval(timerInterval);
        gameActive = false;
        // 统计学会的新单词 (已匹配的卡片去重)
        let learnedSet = new Set();
        gameCards.forEach(card => {
            if (card.matched) learnedSet.add(card.wordObj.eng);
        });
        document.getElementById('finalScoreSpan').innerText = currentScore;
        let starNum = starsDisplaySpan.innerText.split('★').length - 1;
        let starShow = '★'.repeat(starNum) + '☆'.repeat(3 - starNum);
        document.getElementById('finalStarsSpan').innerHTML = starShow;
        document.getElementById('newWordsCount').innerText = learnedSet.size;
        gameOverModal.classList.add('show');
    }

    // 时间耗尽处理
    function timeOutHandler() {
        if (gameActive && timeLeft <= 0) {
            clearInterval(timerInterval);
            gameActive = false;
            showMessage("⏰ 时间用完了！点开始继续挑战~", false);
            endGameFlow(false);
        }
    }

    // 重置选择暂存
    function clearSelected() {
        firstCard = null;
        secondCard = null;
    }

    // 配对检查
    function checkMatch() {
        const cardA = firstCard.card;
        const cardB = secondCard.card;
        const isMatch = (cardA.pairId === cardB.pairId);
        if (isMatch) {
            playSound('correct');
            const bonus = 10 + currentCombo * 2;
            currentScore += bonus;
            currentCombo++;
            const praises = ["Great Job!", "Excellent!", "Awesome!", "Perfect!"];
            const randomMsg = praises[Math.floor(Math.random() * praises.length)];
            showMessage(randomMsg, true);
            dropStarEffect();
            // 标记为已配对并消除
            cardA.matched = true;
            cardB.matched = true;
            matchedCount++;
            cardA.flipped = false;
            cardB.flipped = false;
            // 更新dom样式
            firstCard.dom.classList.add('matched');
            secondCard.dom.classList.add('matched');
            refreshUI();
            clearSelected();
            lockBoard = false;
            if (matchedCount === totalPairs) gameVictory();
        } else {
            playSound('wrong');
            showMessage("Try Again ~ 再试试看！", false);
            currentCombo = 0;
            firstCard.dom.classList.add('shake-card');
            secondCard.dom.classList.add('shake-card');
            setTimeout(() => {
                if (gameCards[firstCard.idx]) gameCards[firstCard.idx].flipped = false;
                if (gameCards[secondCard.idx]) gameCards[secondCard.idx].flipped = false;
                firstCard.dom.classList.remove('flipped');
                secondCard.dom.classList.remove('flipped');
                firstCard.dom.classList.remove('shake-card');
                secondCard.dom.classList.remove('shake-card');
                clearSelected();
                lockBoard = false;
            }, 450);
            refreshUI();
        }
    }

    // 卡片点击逻辑
    function onCardClick(idx, domCard) {
        if (!gameActive || lockBoard) return;
        const card = gameCards[idx];
        if (card.matched || card.flipped) return;
        card.flipped = true;
        domCard.classList.add('flipped');
        if (firstCard === null) {
            firstCard = { idx, card, dom: domCard };
        } else if (secondCard === null && firstCard.idx !== idx) {
            secondCard = { idx, card, dom: domCard };
            lockBoard = true;
            checkMatch();
        }
    }

    // 渲染网格
    function renderGameBoard() {
        cardsGrid.innerHTML = '';
        gameCards.forEach((card, idx) => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            if (card.flipped) cardDiv.classList.add('flipped');
            if (card.matched) cardDiv.classList.add('matched');
            const w = card.wordObj;
            cardDiv.innerHTML = `
                <div class="card-front">
                    <div class="word-emoji">${w.emoji}</div>
                    <div class="word-text">${w.eng}</div>
                    <div class="sound-icon" data-word="${w.eng}" data-example="${w.example}">🔊</div>
                    <div class="chinese-text">${w.chn}</div>
                </div>
                <div class="card-back">
                    <span>❓</span>
                    <span>🐣</span>
                </div>
            `;
            const soundBtn = cardDiv.querySelector('.sound-icon');
            soundBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                speakWord(w.eng, w.example);
            });
            cardDiv.addEventListener('click', (e) => {
                if (e.target.classList.contains('sound-icon')) return;
                onCardClick(idx, cardDiv);
            });
            cardsGrid.appendChild(cardDiv);
        });
    }

    // 重置并开始游戏（初始化）
    function startGame() {
        if (timerInterval) clearInterval(timerInterval);
        currentLevel = parseInt(levelSelect.value);
        const selectedWords = getCardsByLevel(currentLevel);
        totalPairs = selectedWords.length;
        let deck = [];
        for (let i = 0; i < selectedWords.length; i++) {
            deck.push({ id: i * 2, wordObj: selectedWords[i], matched: false, flipped: false, pairId: i });
            deck.push({ id: i * 2 + 1, wordObj: selectedWords[i], matched: false, flipped: false, pairId: i });
        }
        // Fisher-Yates 洗牌
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        gameCards = deck;
        matchedCount = 0;
        currentScore = 0;
        currentCombo = 0;
        timeLeft = (currentLevel === 1 ? 75 : (currentLevel === 2 ? 65 : 55));
        lockBoard = false;
        firstCard = secondCard = null;
        gameActive = true;
        renderGameBoard();
        refreshUI();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (gameActive && timeLeft > 0) {
                timeLeft--;
                refreshUI();
                if (timeLeft === 0) {
                    clearInterval(timerInterval);
                    timeOutHandler();
                }
            } else if (!gameActive) {
                clearInterval(timerInterval);
            }
        }, 1000);
        showMessage("游戏开始！ 配对单词和图片吧 ✨", true);
    }

    // 重置按钮相同行为
    function resetAndPlay() {
        startGame();
    }

    // 事件绑定
    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', resetAndPlay);
    playAgainModalBtn.addEventListener('click', () => {
        gameOverModal.classList.remove('show');
        startGame();
    });
    // 背景音乐模拟（实际开/关简单音效播放开关，展示UI反馈，不影响核心游戏）
    const musicBtn = document.getElementById('bgMusicBtn');
    musicBtn.addEventListener('click', () => {
        bgmEnabled = !bgmEnabled;
        musicBtn.innerText = bgmEnabled ? "🔊 音乐开" : "🔇 音乐关";
        if (bgmEnabled) playSound('correct');  // 提示音反馈
    });
    // 初始预热显示demo
    (function initPreview() {
        const demoWords = getCardsByLevel(2).slice(0, 4);
        let demoDeck = [];
        demoWords.forEach((w, idx) => {
            demoDeck.push({ pairId: idx, wordObj: w, matched: false, flipped: false });
            demoDeck.push({ pairId: idx, wordObj: w, matched: false, flipped: false });
        });
        gameCards = demoDeck;
        totalPairs = 4;
        renderGameBoard();
        gameActive = false;
        scoreSpan.innerText = "0";
        comboSpan.innerText = "0";
        timerSpan.innerText = "00:00";
    })();
</script>
</body>
